version: 1
applications:
  - appRoot: apps/web
    backend:
      phases:
        build:
          commands:
            - cd ../.. && npm ci
            - cd apps/web && npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
        build:
          commands:
            - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID --format json
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
